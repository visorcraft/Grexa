version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # cxx-qt 0.9 codegen emits cxxbridge1$198$ symbols. A newer cxx patch
      # exports cxxbridge1$<new>$ and the GUI fails to link.
      - dependency-name: "cxx"
        update-types: ["version-update:semver-patch"]
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    labels:
      - dependencies
      - ci
